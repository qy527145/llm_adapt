[workspace]
resolver = "2"
members = [
    "crates/llm_adapt_core",
    "crates/llm_adapt_cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["wmymz@icloud.com"]
repository = "https://github.com/qy527145/llm_adapt"
description = "Production-grade LLM API abstraction layer for Rust"
rust-version = "1.85"

[workspace.dependencies]
llm_adapt_core = { version = "0.2.0", path = "crates/llm_adapt_core" }
tokio        = { version = "1.40", features = ["full"] }
# 0.13 起 TLS feature 叫 `rustls`（原 `rustls-tls`）。不开 `json`：请求体/响应体都是自己
# 用 serde_json 编解码的。下游 carter / rmcp 都已经在 0.13 上，这里跟上去避免同一个
# crate 编两份（reqwest 0.12 + 0.13 会连带拖进两份 hyper-rustls / base64 / core-foundation）。
reqwest      = { version = "0.13", default-features = false, features = ["stream", "rustls", "socks"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
# 下游全在 thiserror 2 上，跟上去少编一份 thiserror-impl。
thiserror    = "2"
bytes        = "1"
futures-util = "0.3"
tracing      = "0.1"
toml         = "1"
clap         = { version = "4", features = ["derive"] }
dirs         = "6"
anyhow       = "1"
tracing-subscriber = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
